name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  check:
    # Golden reference images are made on macOS and only match there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - id: fvm
        run: echo "flutter=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm.outputs.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: make check FLUTTER=flutter DART=dart
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: golden-failures
          path: test/**/failures/
          if-no-files-found: ignore
